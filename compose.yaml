name: angebote-checker

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to a published GHCR commit tag}
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a persistent PostgreSQL database}
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '8080'
  init: true

services:
  migrate:
    <<: *app
    command: [node, scripts/migrate.mjs]
    restart: 'no'
    mem_limit: 256m

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
