name: Publish VPS image
on:
  push:
    branches: [feature/self-learning-product-catalog]
    paths:
      - 'webapp/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/compose.ci.yaml'
      - 'deploy/compose-smoke.mjs'
      - 'deploy/deny-marktguru.mjs'
      - 'deploy/legacy-model-fixture.mjs'
      - 'deploy/training-job-smoke.mjs'
      - 'deploy/review-smoke.mjs'
      - '.github/workflows/vps-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: angebote-checker:ci
      DATABASE_URL: postgresql://compose:compose-test-only@db:5432/angebote
      COMPOSE_FILE: compose.yaml:deploy/compose.ci.yaml
      COMPOSE_PROJECT_NAME: angebote-ci
      TRAINING_ADMIN_TOKEN: ci-training-owner-key-test-only-73431
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for Compose verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: angebote-checker:ci
      - name: Validate Compose and start services
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 180
      - name: Verify archive and training preparation against PostgreSQL
        run: |
          docker compose exec -T -e COMPOSE_SMOKE_TEST=1 app node --experimental-strip-types --input-type=module < deploy/compose-smoke.mjs
          docker compose exec -T app node --experimental-strip-types scripts/archive-marktguru.ts export /tmp/training-candidates.jsonl
          docker compose exec -T app node -e "const fs=require('node:fs');const rows=fs.readFileSync('/tmp/training-candidates.jsonl','utf8').trim().split('\n').map(JSON.parse);if(!rows.length||rows.some(r=>!r.needsReview))process.exit(1);console.log('training export OK')"
          docker compose restart app
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T -e COMPOSE_SMOKE_TEST=1 -e VERIFY_ONLY=1 app node --experimental-strip-types --input-type=module < deploy/compose-smoke.mjs
      - name: Train and activate a qualified model against the isolated archive
        run: |
          docker compose exec -T app node --experimental-strip-types scripts/product-model.ts train --activate-if-qualified
          docker compose restart app
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T app node --experimental-strip-types scripts/product-model.ts status
      - name: Verify training job concurrency and crash recovery
        run: docker compose exec -T -e COMPOSE_SMOKE_TEST=1 app node --experimental-strip-types --input-type=module < deploy/training-job-smoke.mjs
      - name: Recheck a legacy report without changing weights
        run: |
          legacy_id="$(docker compose exec -T -e COMPOSE_SMOKE_TEST=1 app node --experimental-strip-types --input-type=module < deploy/legacy-model-fixture.mjs)"
          docker compose exec -T app node --experimental-strip-types scripts/product-model.ts recheck "$legacy_id" --activate-if-qualified
          docker compose exec -T -e COMPOSE_SMOKE_TEST=1 -e LEGACY_MODEL_ID="$legacy_id" app node --experimental-strip-types --input-type=module < deploy/legacy-model-fixture.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: webapp
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify interactive UI over ordinary HTTP
        working-directory: webapp
        run: npm run test:browser:http
      - name: Verify reviewed labels entered the new training candidate
        run: docker compose exec -T -e COMPOSE_SMOKE_TEST=1 app node --input-type=module < deploy/review-smoke.mjs
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 60
      - name: Clean isolated test services
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ivzaislu/ha-angebote-checker:vps
            ghcr.io/ivzaislu/ha-angebote-checker:${{ github.sha }}
