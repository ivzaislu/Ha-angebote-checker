# Explicit opt-in experiment. Never merged into the application's COMPOSE_FILE.
name: angebote-vision
services:
  vision:
    image: ${VISION_IMAGE:?Run deploy/vision.py prepare with a pinned image first}
    platform: linux/amd64
    user: '65534:65534'
    command:
      - --model
      - /models/SmolVLM-256M-Instruct-Q8_0.gguf
      - --mmproj
      - /models/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
      - --alias
      - products-vision
      - --host
      - 0.0.0.0
      - --port
      - '8081'
      - --ctx-size
      - '1536'
      - --parallel
      - '1'
      - --threads
      - '1'
      - --threads-batch
      - '1'
      - --batch-size
      - '64'
      - --ubatch-size
      - '32'
      - --n-gpu-layers
      - '0'
      - --no-mmproj-offload
      - --image-max-tokens
      - '256'
      - --no-warmup
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - type: bind
        source: ${VISION_MODEL_DIR:?Run deploy/vision.py prepare first}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: 'no'
    cpus: 1.0
    mem_limit: 512m
    # Total RAM + swap; limits apply to this experimental container only.
    memswap_limit: 768m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/health]
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
