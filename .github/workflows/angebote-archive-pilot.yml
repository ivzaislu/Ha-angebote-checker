name: Angebote archive pilot
on:
  workflow_dispatch:
    inputs:
      dataset:
        type: choice
        options: [multistore, expanded, pilot]
        default: multistore
        description: 'multistore: weitere Geschäfte; expanded: vorherige Partie; pilot: erster Versuch'
      mode:
        type: choice
        options: [pilot, collect]
        default: pilot
        description: 'pilot: festgelegte Quellen und Annotationen; collect: neue unbewertete Seiten'
      archive_url:
        type: string
        default: https://angebote.com/lidl/archives
        description: Archivübersicht für collect
      max_pages:
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '2'
        description: Maximale Seitenzahl für collect
  push:
    branches: [feature/self-learning-product-catalog]
    paths:
      - '.github/workflows/angebote-archive-pilot.yml'
      - 'tools/angebote_archive.py'
      - 'tools/test_angebote_archive.py'
      - 'training/angebote/**'
      - 'webapp/scripts/train-archive-pilot.ts'
      - 'webapp/src/lib/archive-lessons*'
      - 'webapp/src/lib/archive-experiment*'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATASET: ${{ inputs.dataset || 'multistore' }}
      PILOT_MODE: ${{ inputs.mode || 'pilot' }}
      ARCHIVE_URL: ${{ inputs.archive_url || 'https://angebote.com/lidl/archives' }}
      MAX_PAGES: ${{ inputs.max_pages || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded extraction and failure reporting
        run: PYTHONPATH=tools python -m unittest tools/test_angebote_archive.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install training dependencies
        working-directory: webapp
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Test evidence validation and held-out isolation
        working-directory: webapp
        run: node --experimental-strip-types --test src/lib/archive-experiment.test.ts src/lib/archive-lessons.test.ts
      - name: Collect historical OCR pages and source images
        run: |
          case "$DATASET" in multistore|expanded|pilot) ;; *) exit 1 ;; esac
          if [ "$PILOT_MODE" = pilot ]; then
            python tools/angebote_archive.py --manifest "training/angebote/$DATASET-sources.json" --out .angebote-pilot/run
          else
            python tools/angebote_archive.py --archive-url "$ARCHIVE_URL" --max-pages "$MAX_PAGES" --out .angebote-pilot/run
          fi
      - name: Train isolated candidate and measure held-out offers
        if: env.PILOT_MODE == 'pilot'
        run: |
          scope_args=()
          if [ "$DATASET" = expanded ] || [ "$DATASET" = multistore ]; then
            scope_args=(training/angebote/expanded-scope.json)
            cp training/angebote/expanded-scope.json .angebote-pilot/run/authored-scope.json
          fi
          if [ "$DATASET" = multistore ]; then
            scope_args+=(training/angebote/expanded-annotations.jsonl)
            cp training/angebote/expanded-annotations.jsonl .angebote-pilot/run/previous-annotations.jsonl
            cp training/angebote/multistore-coverage.json .angebote-pilot/run/retailer-coverage.json
          fi
          node --max-old-space-size=256 --experimental-strip-types webapp/scripts/train-archive-pilot.ts \
            .angebote-pilot/run/pages.jsonl "training/angebote/$DATASET-annotations.jsonl" .angebote-pilot/model "${scope_args[@]}"
          cp "training/angebote/$DATASET-annotations.jsonl" .angebote-pilot/run/annotations.jsonl
      - name: Record outcome
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Archiv-Pilot\n\n')
              report = Path('.angebote-pilot/run/report.json')
              if report.exists():
                  out.write('Sammlerbericht:\n\n```json\n'+report.read_text()+'\n```\n\n')
              evaluation = Path('.angebote-pilot/model/evaluation.json')
              if evaluation.exists():
                  r = json.loads(evaluation.read_text())
                  out.write(f"Produkte: {r['products']}; Trainings-/Validierungspaare: {r['archiveTrainExamples']}; zurückgehalten: {r['archiveHoldoutExamples']}.\n\n")
                  out.write(f"Gewichte aktualisiert: {r['candidate']['learning']['weightsUpdated']}.\n\n")
                  out.write(f"Redaktioneller Kontrollsatz: {r['candidate']['eligible']}.\n\n")
                  out.write(f"Archiv ohne Verschlechterung: {r['archiveReleaseGate']['passed']}.\n\n")
                  out.write(f"Experiment insgesamt qualifiziert: {r['experimentQualified']}.\n\n")
                  out.write(f"Archivklassen: {r['archiveClassCounts']}.\n\n")
                  out.write(f"Unterstützte Suchanfragen: {', '.join(r['supportedIntents'])}.\n\n")
                  for reason in r['candidate']['reasons']+r['archiveReleaseGate']['reasons']:
                      out.write(f"- {reason}\n")
                  out.write('\n')
                  for brochure, measured in r['archiveHoldoutByBrochure'].items():
                      before, after = measured[r['comparison']]['all'], measured['candidate']['all']
                      out.write(f"{brochure}: {before['tp']+before['tn']} → {after['tp']+after['tn']} von {after['count']} korrekt.\n\n")
                  for name in [r['comparison'], 'candidate']:
                      m = r['archiveHoldout'][name]['all']
                      out.write(f"{name}: {m['tp']+m['tn']}/{m['count']} zurückgehaltene Paare korrekt.\n\n")
                  out.write('### Geschäfte\n\n')
                  for retailer, stats in r['retailerSummary'].items():
                      out.write(f"{retailer}: {stats['trainProducts']} Lernprodukte, {stats['holdoutProducts']} Prüfprodukte. ")
                      m = r['archiveHoldoutByRetailer'][retailer]
                      if m:
                          before, after = m[r['comparison']]['all'], m['candidate']['all']
                          out.write(f"{before['tp']+before['tn']} → {after['tp']+after['tn']} von {after['count']} korrekt; {stats['holdoutPositive']} positive Prüffälle.\n\n")
                      else:
                          out.write('Keine zurückgehaltenen Fälle; keine unabhängige Genauigkeitsmessung.\n\n')
              elif os.environ['PILOT_MODE'] == 'pilot':
                  out.write('Kein abgeschlossenes Trainingsergebnis vorhanden. Fehler im Laufprotokoll prüfen.\n\n')
              out.write('Quellen und Annotationen prüfen. Ein erfolgreicher Workflow ist kein Nachweis besserer Produktgenauigkeit. Keine Produktionsaktivierung.\n')
          PY
      - name: Upload source evidence, annotations, models and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angebote-archive-pilot-${{ github.run_id }}
          path: |
            .angebote-pilot/run/
            .angebote-pilot/model/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
