name: Standalone app checks
on:
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/standalone-checks.yml'
  push:
    branches:
      - feature/self-learning-product-catalog
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm install --no-save --package-lock=false
        # Existing package-lock.json is inconsistent with package.json; avoid blocking checks.
      - run: npm run typecheck
      - run: npm test
