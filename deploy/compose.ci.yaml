# Isolated PostgreSQL fixture for CI; not part of the production configuration.
services:
  app:
    mem_limit: 384m
    environment:
      # Retired settings must not restore removed application features.
      PRODUCT_MATCHING_MODE: neural
      TRAINING_ADMIN_TOKEN: retired-fixture-key-not-used
      NODE_OPTIONS: --max-old-space-size=256 --import /checks/deny-marktguru.mjs
    volumes:
      - ./deploy/deny-marktguru.mjs:/checks/deny-marktguru.mjs:ro
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compose
      POSTGRES_PASSWORD: compose-test-only
      POSTGRES_DB: angebote
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U compose -d angebote']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    depends_on:
      db:
        condition: service_healthy
