name: Local vision experiment
on:
  push:
    branches: [feature/self-learning-product-catalog]
    paths:
      - 'deploy/vision.py'
      - 'deploy/test_vision.py'
      - 'deploy/vision-models.json'
      - 'deploy/compose.vision.yaml'
      - '.github/workflows/local-vision-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test downloader, isolation and pixel request
        run: python3 -m unittest discover -s deploy -p test_vision.py -v
      - name: Validate archive sampler SQL against isolated PostgreSQL
        run: |
          docker run -d --name angebote-vision-sample-ci --memory 128m --cpus 1 -e POSTGRES_USER=vision -e POSTGRES_PASSWORD=ci-test-only -e POSTGRES_DB=vision postgres:16-alpine
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec angebote-vision-sample-ci pg_isready -h 127.0.0.1 -U vision -d vision; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          VISION_POSTGRES_TEST=1 python3 -m unittest discover -s deploy -p test_vision.py -v
      - name: Remove isolated sampler database before measuring vision memory
        if: always()
        run: docker rm -f angebote-vision-sample-ci || true
      - name: Resolve upstream CPU image to immutable digest
        id: upstream
        run: |
          docker pull --platform linux/amd64 ghcr.io/ggml-org/llama.cpp:server
          image="$(docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{index .RepoDigests 0}}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved CPU runtime: $image"
      - name: Download pinned model and vision projector with SHA256 checks
        run: python3 deploy/vision.py prepare --image '${{ steps.upstream.outputs.image }}'
      - name: Start CPU vision service under experimental memory limit
        run: python3 deploy/vision.py start
      - name: Exercise real image decoding and local multimodal inference
        run: |
          python3 -c 'from deploy.test_vision import png_fixture;from pathlib import Path;Path(".vision/pipeline.png").write_bytes(png_fixture())'
          python3 deploy/vision.py bench --image-file .vision/pipeline.png
          python3 deploy/vision.py bench --image-file .vision/pipeline.png --task type --repeat 2
          python3 -c 'import glob,json;rows=[json.load(open(p)) for p in glob.glob(".vision/result-*.json")];typed=sorted([r for r in rows if r["task"]=="type"],key=lambda r:r["pass_index"]);assert len(typed)==2 and [r["pass_index"] for r in typed]==[1,2];assert typed[0]["image_sha256"]==typed[1]["image_sha256"];assert all(not r.get("error") and r["cache_prompt"] is False for r in typed);assert all(r.get("usage",{}).get("prompt_tokens_details",{}).get("cached_tokens")==0 for r in typed)'
          python3 deploy/vision.py status
      - name: Diagnostics
        if: failure()
        run: |
          if [ -f .vision/config.json ]; then
            python3 deploy/vision.py status || true
            python3 deploy/vision.py logs || true
          fi
      - name: Stop only the experimental service
        if: always()
        run: |
          if [ -f .vision/config.json ]; then python3 deploy/vision.py stop; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-pipeline-report
          path: .vision/result-*.json
          if-no-files-found: ignore
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested CPU runtime
        run: |
          image='ghcr.io/ivzaislu/ha-angebote-checker:vision-${{ github.sha }}'
          docker tag '${{ steps.upstream.outputs.image }}' "$image"
          docker push "$image"
          # A cross-repository push can rewrite the manifest. RepoDigests in the
          # local Docker cache can retain the old upstream digest: resolve remotely.
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Invalid published manifest digest' >&2
            exit 1
          fi
          published="ghcr.io/ivzaislu/ha-angebote-checker@$digest"
          docker pull --platform linux/amd64 "$published"
          printf '%s\n' "$published" > .vision/published-image.txt
          echo "PUBLISHED_VISION_IMAGE=$published"
          echo "Verified vision runtime: \`$published\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vision-runtime-digest
          path: .vision/published-image.txt
