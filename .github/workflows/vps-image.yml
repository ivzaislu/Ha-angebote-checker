name: Publish VPS image
on:
  push:
    branches: [feature/self-learning-product-catalog]
    paths:
      - 'webapp/**'
      - 'Dockerfile'
      - '.github/workflows/vps-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ivzaislu/ha-angebote-checker:vps
            ghcr.io/ivzaislu/ha-angebote-checker:${{ github.sha }}
